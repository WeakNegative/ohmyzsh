name: Freqtrade Hyperopt Matrix

on:
  workflow_dispatch:  # Manual trigger

jobs:
  # Step 1: Read matrix JSON
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 📄 Read JSON Matrix
        id: set-matrix
        run: |
          matrix=$(cat .github/matrix.json | jq -c '.')
          echo "Loaded Matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # Step 2: Run parallel jobs from matrix
  run-hyperopt:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 🧠 Run Hyperopt
        run: |
          echo "Running hyperopt..."
          echo "Strategy: ${{ matrix.config.strategy }}"
          echo "Loss Type: ${{ matrix.config.loss }}"
          echo "Space: ${{ matrix.config.space }}"

          # Example Command:
          # freqtrade hyperopt \
          #   --strategy ${{ matrix.config.strategy }} \
          #   --spaces ${{ matrix.config.space }} \
          #   --hyperopt-loss ${{ matrix.config.loss }} \
          #   --config user_data/config.json
